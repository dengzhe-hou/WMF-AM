   </g>
   <g id="text_18">
    <text style="font-size: 5.9px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #555555" x="141.959055" y="99.680842" transform="rotate(-0 141.959055 99.680842)">one-integer / last-integer</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="141.959055" y="109.603198" transform="rotate(-0 141.959055 109.603198)">Written steps</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="141.959055" y="116.056713" transform="rotate(-0 141.959055 116.056713)">“Think step by step …”</text>
   </g>
   <g id="text_21">
    <text style="font-size: 5.9px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #555555" x="141.959055" y="122.161885" transform="rotate(-0 141.959055 122.161885)">512 tokens · last integer</text>
   </g>
   <g id="text_22">
    <text style="font-style: italic; font-size: 5.9px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #555555" x="141.959055" y="128.522322" transform="rotate(-0 141.959055 128.522322)">more room to write steps</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="249.448819" y="15.783546" transform="rotate(-0 249.448819 15.783546)">3  Score the answer</text>
   </g>
