   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="141.959055" y="87.067765" transform="rotate(-0 141.959055 87.067765)">Large budget</text>
   </g>
