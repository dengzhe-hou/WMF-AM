   </g>
   <g id="text_27">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1a1a1a" x="282.55748" y="42.70556" transform="rotate(-0 282.55748 42.70556)">correct</text>
   </g>
   <g id="text_28">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans Mono'; text-anchor: start" x="249.902362" y="58.602236" transform="rotate(-0 249.902362 58.602236)">“28”</text>
   </g>
   <g id="text_29">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1a1a1a" x="282.55748" y="58.296111" transform="rotate(-0 282.55748 58.296111)">one integer, wrong</text>
   </g>
   <g id="text_30">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans Mono'; text-anchor: start" x="249.902362" y="74.192788" transform="rotate(-0 249.902362 74.192788)">“17, 15, 12”</text>
   </g>
   <g id="text_31">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; fill: #555555" transform="translate(253.984252 84.516584)">several integers, wrong by</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; fill: #555555" transform="translate(253.984252 90.92501)">the one-integer rule, correct</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; fill: #555555" transform="translate(253.984252 97.333437)">by the last-integer rule</text>
   </g>
   <g id="text_32">
    <text style="font-size: 5.9px; font-family: 'Arial', 'Helvetica', sans-serif; fill: #555555" transform="translate(249.902362 121.901879)">Responses that hit the token</text>
