z
" style="fill: #ededed"/>
    </g>
    <text style="font-size: 5px; font-family: 'DejaVu Sans Mono'" transform="translate(8.617323 27.920269)">Leo: 15 points, James: 18 points,</text>
    <text style="font-size: 5px; font-family: 'DejaVu Sans Mono'" transform="translate(8.617323 33.933629)">Carol: 15 points</text>
    <text style="font-size: 5px; font-family: 'DejaVu Sans Mono'" transform="translate(8.617323 39.946988)">1. Carol gives 2 points to Leo.</text>
    <text style="font-size: 5px; font-family: 'DejaVu Sans Mono'" transform="translate(8.617323 45.994723)">2. Leo loses 2 points.</text>
    <text style="font-size: 5px; font-family: 'DejaVu Sans Mono'" transform="translate(8.617323 52.008082)">3. Leo loses 3 points.</text>
    <text style="font-size: 5px; font-family: 'DejaVu Sans Mono'" transform="translate(8.617323 58.021441)">How many points does Leo have?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="8.617323" y="73.266477" transform="rotate(-0 8.617323 73.266477)">Code computes the answer:</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="8.617323" y="85.94682" transform="rotate(-0 8.617323 85.94682)">15 + 2 − 2 − 3 = 12</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="8.617323" y="128.452789" transform="rotate(-0 8.617323 128.452789)">K = 3 to 100 updates per item.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial', 'Helvetica', sans-serif" transform="translate(133.341732 15.804921)">2  Vary the response</text>
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial', 'Helvetica', sans-serif" transform="translate(133.341732 23.504646)">    protocol</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="141.959055" y="35.618946" transform="rotate(-0 141.959055 35.618946)">Core</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="159.717402" y="35.698384" transform="rotate(-0 159.717402 35.698384)">“Respond with ONLY</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="141.959055" y="41.996899" transform="rotate(-0 141.959055 41.996899)">the final number.”</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.9px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #555555" x="141.959055" y="48.177633" transform="rotate(-0 141.959055 48.177633)">16 tokens · one integer</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="141.959055" y="58.154379" transform="rotate(-0 141.959055 58.154379)">Instructions</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="141.959055" y="64.607894" transform="rotate(-0 141.959055 64.607894)">new user/system prompts</text>
   </g>
   <g id="text_13">
    <text style="font-size: 5.9px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #555555" x="141.959055" y="70.713066" transform="rotate(-0 141.959055 70.713066)">16 tokens · one integer</text>
   </g>
   <g id="text_14">
