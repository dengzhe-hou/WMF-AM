   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="8.16378" y="15.783546" transform="rotate(-0 8.16378 15.783546)">1  Generate an item</text>
   </g>
   <g id="text_2">
    <g id="patch_13">
     <path d="M 8.617323 61.061285 
L 107.952479 61.061285 
